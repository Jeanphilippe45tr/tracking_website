<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

      content="Live parcel tracking, delivery estimates and relay points across Cameroon, France and beyond."

    />

    <meta name="twitter:title" content="SwiftTrack — Track your parcel in real time" />

      name="twitter:description"
      content="Live parcel tracking, delivery estimates and relay points across Cameroon, France and beyond."
    />
    <link rel="canonical" href="https://www.swifttrack.cm/" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />

    ></script>
